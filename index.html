<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111418" />
    <meta name="description" content="WYLOR Financeiro, gestão financeira empresarial." />
    <title>WYLOR Financeiro</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#dashboard" aria-label="WYLOR Financeiro, início">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-copy"><strong>WYLOR</strong><small>FINANCEIRO</small></span>
        </a>
        <div class="workspace-label">ESPAÇO DE TRABALHO</div>
        <nav class="primary-nav" id="primary-nav"></nav>
        <div class="sidebar-bottom">
          <div class="connection-card">
            <span class="connection-dot" aria-hidden="true"></span>
            <div><strong>Configuração pendente</strong><small>Conecte o Supabase para começar</small></div>
          </div>
          <div class="sidebar-footer"><span class="footer-monogram">W</span><span>WYLOR <small>Gestão financeira</small></span><span class="version">ETAPA 1</span></div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="breadcrumbs"><span>WYLOR</span><span class="crumb-separator">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
          <div class="topbar-actions">
            <span class="environment-pill"><span></span> AMBIENTE EM CONFIGURAÇÃO</span>
            <button class="profile-button" type="button" aria-label="Perfil indisponível até conectar o acesso"><span class="profile-avatar">W</span><span class="profile-copy"><strong>Acesso pendente</strong><small>Configure sua conta</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
        </header>

        <main id="conteudo" tabindex="-1">
          <div class="page-content" id="page-content"></div>
        </main>
        <footer class="main-footer"><span>WYLOR Financeiro</span><span>Etapa 1 · Fundação do sistema</span></footer>
      </div>
      <button class="scrim" id="scrim" type="button" aria-label="Fechar menu"></button>
    </div>
  </body>
</html>
